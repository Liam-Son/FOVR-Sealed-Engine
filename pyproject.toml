[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fovr-sealed-engine"
version = "23.1.0"
description = "FOVR v23 sealed dual-engine research stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-q"
